name: Build StampBOX Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/desktop-build.yml"
      - "assets/**"
      - "config/**"
      - "customer_web/**"
      - "desktop_app/**"
      - "src/**"

permissions:
  contents: read

env:
  STAMPBOX_VERSION: "1.0.6"

jobs:
  macos:
    name: macOS DMG (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: Apple Silicon
            suffix: arm64
            target_arch: arm64
          - runner: macos-15-intel
            label: Intel
            suffix: x64
            target_arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      STAMPBOX_TARGET_ARCH: ${{ matrix.target_arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop_app/requirements-desktop.txt

      - name: Build app and DMG
        run: |
          chmod +x desktop_app/build_macos.sh
          echo "Runner architecture: $(uname -m)"
          ./desktop_app/build_macos.sh
          mv \
            "dist/StampBOX-macOS-${STAMPBOX_VERSION}.dmg" \
            "dist/StampBOX-macOS-${{ matrix.suffix }}-${STAMPBOX_VERSION}.dmg"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v6
        with:
          name: StampBOX-macOS-${{ matrix.suffix }}
          path: dist/StampBOX-macOS-${{ matrix.suffix }}-1.0.6.dmg
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop_app/requirements-desktop.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: .\desktop_app\build_windows.ps1

      - name: Smoke test packaged app
        shell: powershell
        run: |
          $env:STAMPBOX_SMOKE_TEST = "1"
          $env:STAMPBOX_MAPPING_OFFLINE = "1"
          & "D:\StampBOXDesktopBuild\dist\StampBOX\StampBOX.exe"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: StampBOX-Windows-x64
          path: D:\StampBOXDesktopBuild\dist\installer\StampBOX-Setup-1.0.6.exe
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish desktop release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${STAMPBOX_VERSION}"
          ARM64_DMG="release-assets/StampBOX-macOS-arm64/StampBOX-macOS-arm64-${STAMPBOX_VERSION}.dmg"
          X64_DMG="release-assets/StampBOX-macOS-x64/StampBOX-macOS-x64-${STAMPBOX_VERSION}.dmg"
          WINDOWS_EXE="release-assets/StampBOX-Windows-x64/StampBOX-Setup-${STAMPBOX_VERSION}.exe"
          sha256sum "$ARM64_DMG" "$X64_DMG" "$WINDOWS_EXE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$ARM64_DMG#StampBOX for Apple Silicon (M1-M4)" \
              "$X64_DMG#StampBOX for Intel Mac" \
              "$WINDOWS_EXE#StampBOX for Windows 10-11" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              "$ARM64_DMG#StampBOX for Apple Silicon (M1-M4)" \
              "$X64_DMG#StampBOX for Intel Mac" \
              "$WINDOWS_EXE#StampBOX for Windows 10-11" \
              --target "$GITHUB_SHA" \
              --title "StampBOX Desktop ${STAMPBOX_VERSION}" \
              --notes "Merges product mappings from Sheet1, Sheet2, and so goods, including headerless tabs and separate product-code/color columns. Windows and both macOS installers passed packaged-app smoke checks." \
              --repo "$GITHUB_REPOSITORY"
          fi
