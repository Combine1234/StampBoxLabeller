name: Build StampBOX Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/desktop-build.yml"
      - "assets/**"
      - "config/**"
      - "customer_web/**"
      - "desktop_app/**"
      - "src/**"

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: Apple Silicon
            suffix: arm64
            target_arch: arm64
          - runner: macos-15-intel
            label: Intel
            suffix: x64
            target_arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      STAMPBOX_TARGET_ARCH: ${{ matrix.target_arch }}
      STAMPBOX_VERSION: "1.0.1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop_app/requirements-desktop.txt

      - name: Build app and DMG
        run: |
          chmod +x desktop_app/build_macos.sh
          echo "Runner architecture: $(uname -m)"
          ./desktop_app/build_macos.sh
          mv \
            "dist/StampBOX-macOS-${STAMPBOX_VERSION}.dmg" \
            "dist/StampBOX-macOS-${{ matrix.suffix }}-${STAMPBOX_VERSION}.dmg"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v6
        with:
          name: StampBOX-macOS-${{ matrix.suffix }}
          path: dist/StampBOX-macOS-${{ matrix.suffix }}-1.0.1.dmg
          if-no-files-found: error
          compression-level: 0
